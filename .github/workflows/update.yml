name: Weekly Steam Indie Fetch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 10 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch this week's indie data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit and push data
        run: |
          git config user.name "Steam Indie Bot"
          git config user.email "bot@steam-indie-tracker"
          git add data/
          git diff --staged --quiet || git commit -m "Update weekly indie data $(date +%Y-%m-%d)"
          git push
