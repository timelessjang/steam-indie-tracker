name: Weekly Steam Indie Fetch

on:
  schedule:
    # Every Tuesday at 10:00 UTC (Steam updates weekly charts on Tuesdays)
    - cron: '0 10 * * 2'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run fetch script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch.py

      - name: Commit and push data
        run: |
          git config user.name "Steam Indie Bot"
          git config user.email "bot@steam-indie-tracker"
          git add data/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "📊 Weekly indie data update $(date +%Y-%m-%d)"
          git push
