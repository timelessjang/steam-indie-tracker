<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Indie Tracker | 本周热门独立游戏玩法趋势</title>
  <meta name="description" content="每周自动追踪 Steam 本周火爆独立游戏，过滤 3A 和大厂发行作品，分析玩法标签、核心 Hook、玩法公式和趋势分类。">
  <style>
    :root{color-scheme:dark;--bg:#090a10;--panel:#121420;--panel2:#191c2b;--line:rgba(255,255,255,.09);--text:#f3f0e8;--muted:#a4a7b7;--dim:#696e83;--blue:#7aa2ff;--green:#89f27d;--gold:#ffd166;--cyan:#58e6d9;--shadow:0 18px 60px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(122,162,255,.18),transparent 28rem),radial-gradient(circle at 80% 0,rgba(255,122,168,.10),transparent 24rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;line-height:1.65}a{color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}header{padding:72px 0 36px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:14px 0;font-size:clamp(34px,7vw,76px);line-height:.98;letter-spacing:-.06em}.lead{max-width:760px;color:var(--muted);font-size:18px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:999px;padding:8px 13px;color:var(--muted);font-size:13px}select,button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit}button{cursor:pointer}button.active{background:var(--blue);border-color:var(--blue);color:#071022;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 28px}.stat{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--dim);font-size:13px}.insight{border:1px solid rgba(122,162,255,.22);background:rgba(122,162,255,.08);border-radius:22px;padding:20px;margin:22px 0}.insight h2,.section-title{margin:0 0 10px;font-size:14px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:64px}.card{background:linear-gradient(180deg,rgba(25,28,43,.96),rgba(18,20,32,.96));border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.hero{display:block;width:100%;aspect-ratio:460/215;object-fit:cover;background:var(--panel2)}.card-body{padding:18px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{margin:0;font-size:21px;line-height:1.2;letter-spacing:-.02em}.badge{flex:none;color:#071022;background:var(--green);font-weight:800;border-radius:999px;padding:4px 9px;font-size:12px}.meta{color:var(--dim);font-size:13px;margin-top:7px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 12px}.tag{border-radius:999px;padding:4px 9px;font-size:12px;background:rgba(122,162,255,.13);color:#bdd0ff}.formula{color:var(--cyan);font-weight:800;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.hook{color:var(--muted);margin:10px 0 0}.trend{display:inline-block;margin-top:14px;color:var(--gold);font-size:13px}.empty,.loading{color:var(--muted);padding:48px 0;text-align:center}footer{border-top:1px solid var(--line);padding:28px 0 42px;color:var(--dim);font-size:13px}@media(max-width:760px){header{padding-top:44px}.stats,.grid{grid-template-columns:1fr}.lead{font-size:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Steam Indie Tracker</div>
      <h1>本周热门独立游戏玩法趋势</h1>
      <p class="lead">自动扫描 Steam 本周热榜与热门新品，只保留最近 7 天上架的独立团队作品，过滤 3A 与大厂发行游戏，并拆解玩法标签、核心 Hook、玩法公式和趋势分类。</p>
      <div class="toolbar">
        <span class="pill">数据源：Steam + SteamSpy</span>
        <span class="pill" id="windowPill">范围：最近 7 天新上架</span>
        <span class="pill">排除：3A / 大厂发行</span>
        <select id="weekSelect" aria-label="选择周报"></select>
      </div>
    </header>
    <section class="stats">
      <div class="stat"><b id="count">-</b><span>本周入选</span></div>
      <div class="stat"><b id="checked">-</b><span>扫描候选</span></div>
      <div class="stat"><b id="topTrend">-</b><span>最热趋势</span></div>
      <div class="stat"><b id="date">-</b><span>更新日期</span></div>
    </section>
    <section class="insight" id="insight" hidden><h2>本周观察</h2><p id="insightText"></p></section>
    <section><div class="section-title">Trend Filters</div><div class="filters" id="filters"></div></section>
    <section class="grid" id="games"><div class="loading">正在加载本周数据...</div></section>
  </main>
  <footer class="wrap">每周二自动更新。开源仓库：<a href="https://github.com/timelessjang/steam-indie-tracker">timelessjang/steam-indie-tracker</a></footer>
  <script>
    const state={archives:{},weeks:[],data:null,filter:"all"};const $=id=>document.getElementById(id);
    async function loadJson(url){const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error(`${url}: ${res.status}`);return res.json()}
    async function init(){try{const index=await loadJson("data/archive_index.json");await Promise.all((index.weeks||[]).map(async week=>{try{state.archives[week]=await loadJson(`data/archive_${week}.json`)}catch{}}))}catch{}try{const weekly=await loadJson("data/weekly.json");state.archives[weekly.week_of]=weekly}catch{}state.weeks=Object.keys(state.archives).sort().reverse();if(!state.weeks.length){$("games").innerHTML='<div class="empty">还没有数据。请先运行 GitHub Actions 或 python scripts/fetch.py。</div>';return}buildWeekSelect();showWeek(state.weeks[0])}
    function buildWeekSelect(){const select=$("weekSelect");select.innerHTML=state.weeks.map((week,index)=>`<option value="${week}">${week}${index===0?" 最新":""}</option>`).join("");select.onchange=()=>showWeek(select.value)}
    function showWeek(week){state.data=state.archives[week];state.filter="all";render()}
    function render(){const data=state.data;const games=data.games||[];const trends={};for(const game of games){const trend=game.analysis?.trend_category||"未分类";trends[trend]=(trends[trend]||0)+1}const ranked=Object.entries(trends).sort((a,b)=>b[1]-a[1]);$("count").textContent=data.total_indie??games.length;$("checked").textContent=data.total_checked??"-";$("topTrend").textContent=ranked[0]?.[0]||"-";$("date").textContent=data.week_of||"-";if(data.release_window_start&&data.release_window_end){$("windowPill").textContent=`范围：${data.release_window_start} 至 ${data.release_window_end}`}renderInsight(ranked,games);renderFilters(ranked);renderGames()}
    function renderInsight(ranked,games){if(!ranked.length){$("insight").hidden=true;return}const[trend,count]=ranked[0];const examples=games.filter(g=>g.analysis?.trend_category===trend).slice(0,3).map(g=>g.name).join("、");$("insight").hidden=false;$("insightText").textContent=`本周最明显的方向是「${trend}」，共有 ${count} 款入选，代表作品包括 ${examples}。这些作品共同说明：小团队仍在用清晰的机制组合和强 Hook 对抗大制作的内容规模。`}
    function renderFilters(ranked){const filters=$("filters");filters.innerHTML=`<button class="${state.filter==="all"?"active":""}" data-filter="all">全部</button>`+ranked.map(([trend,count])=>`<button class="${state.filter===trend?"active":""}" data-filter="${escapeHtml(trend)}">${escapeHtml(trend)} (${count})</button>`).join("");filters.querySelectorAll("button").forEach(button=>{button.onclick=()=>{state.filter=button.dataset.filter;renderFilters(ranked);renderGames()}})}
    function renderGames(){let games=state.data.games||[];if(state.filter!=="all")games=games.filter(game=>game.analysis?.trend_category===state.filter);$("games").innerHTML=games.map(renderCard).join("")||'<div class="empty">这个分类下暂无游戏。</div>'}
    function sourceBadge(game){if(game.rank)return`#${game.rank} 周榜`;if((game.source||"").includes("popular_new"))return"热门新品";if((game.source||"").includes("top_sellers"))return"热销";return"趋势"}
    function renderCard(game){const analysis=game.analysis||{};const tags=(analysis.gameplay_tags||[]).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join("");const image=game.header_image?`<img class="hero" src="${game.header_image}" alt="${escapeHtml(game.name)}">`:"";return`<article class="card">${image}<div class="card-body"><div class="topline"><div><h3 class="name"><a href="${game.url}" target="_blank" rel="noopener">${escapeHtml(game.name)}</a></h3><div class="meta">${escapeHtml(game.developer||"独立开发者")} · ${escapeHtml(game.release_date||"日期未知")} · ${escapeHtml(game.price||"N/A")}</div></div><span class="badge">${escapeHtml(sourceBadge(game))}</span></div><div class="tags">${tags}</div><div class="formula">${escapeHtml(analysis.formula||"")}</div><p class="hook">${escapeHtml(analysis.hook||game.short_description||"")}</p><span class="trend">${escapeHtml(analysis.trend_category||"未分类")}</span></div></article>`}
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
    init();
  </script>
</body>
</html>
